name: AgentServer
options:
  bundleIdPrefix: com.strategicnerds
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true

targets:
  AgentServer:
    type: application
    platform: macOS
    sources:
      - AgentServer
    resources:
      - path: ../server-app/dist
        buildPhase: resources
        type: folder
      - path: ../server-app/package.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.agent-server
        PRODUCT_NAME: Agent Server
        INFOPLIST_FILE: AgentServer/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentServer/AgentServer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LS_MINIMUM_SYSTEM_VERSION: "14.0"
        COMBINE_HIDPI_IMAGES: true
