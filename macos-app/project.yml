name: AgentServer
options:
  bundleIdPrefix: com.strategicnerds
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  NerdsUI:
    path: ../../../../nerdsui/swift
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 955GSY56UT

targets:
  AgentServer:
    type: application
    platform: macOS
    scheme:
      testTargets: []
      gatherCoverageData: false
    sources:
      - path: AgentServer
      - path: ../server-app/dist
        buildPhase: resources
        type: folder
      - path: ../server-app/package.json
        buildPhase: resources
      - path: .build-cache/server-bundle/node_modules
        buildPhase: resources
        type: folder
    dependencies:
      - package: NerdsUI
      - package: Sparkle
      - target: AgentServerEventKit
        embed: false
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.agent-server
        PRODUCT_NAME: Agent Server
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_FILE: AgentServer/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgentServer/AgentServer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LS_MINIMUM_SYSTEM_VERSION: "14.0"
        COMBINE_HIDPI_IMAGES: true
    preBuildScripts:
      - name: Stage production node_modules for bundling
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          if ! command -v npm >/dev/null 2>&1; then
            echo "error: npm not found on PATH; install Node.js before building"
            exit 1
          fi

          SRC_DIR="${SRCROOT}/../server-app"
          STAGING="${SRCROOT}/.build-cache/server-bundle"
          HASH_FILE="$STAGING/.installed-lock-hash"

          if [ ! -f "$SRC_DIR/package-lock.json" ]; then
            echo "error: server-app/package-lock.json missing; run npm install in server-app first"
            exit 1
          fi

          CURRENT_HASH=$(shasum -a 256 "$SRC_DIR/package-lock.json" | awk '{print $1}')
          INSTALLED_HASH=""
          if [ -f "$HASH_FILE" ]; then
            INSTALLED_HASH=$(cat "$HASH_FILE")
          fi

          if [ "$CURRENT_HASH" = "$INSTALLED_HASH" ] && [ -d "$STAGING/node_modules" ] && [ "$(ls -A "$STAGING/node_modules" 2>/dev/null)" ]; then
            echo "Staged node_modules already up to date (lock hash $CURRENT_HASH)"
            exit 0
          fi

          echo "Staging production node_modules..."
          mkdir -p "$STAGING"
          cp -f "$SRC_DIR/package.json" "$STAGING/package.json"
          cp -f "$SRC_DIR/package-lock.json" "$STAGING/package-lock.json"

          cd "$STAGING"
          rm -rf node_modules
          npm ci --omit=dev --ignore-scripts --silent

          echo "$CURRENT_HASH" > "$HASH_FILE"
          echo "Staged production node_modules (lock hash $CURRENT_HASH)"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed and sign helper plus vendored binaries
        script: |
          set -e

          HELPER_SRC="${BUILT_PRODUCTS_DIR}/agent-server-eventkit"
          HELPERS_DIR="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Helpers"
          HELPER_DEST="${HELPERS_DIR}/agent-server-eventkit"

          if [ ! -f "$HELPER_SRC" ]; then
            echo "warning: agent-server-eventkit not built at $HELPER_SRC"
            exit 0
          fi

          mkdir -p "$HELPERS_DIR"
          cp -f "$HELPER_SRC" "$HELPER_DEST"

          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
            echo "Code signing disabled, skipping embedded binary signing"
            exit 0
          fi

          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="-"
          fi

          echo "Signing embedded binaries with identity: $IDENTITY (hardened runtime)"

          codesign --force --options runtime --sign "$IDENTITY" "$HELPER_DEST"

          NODE_MODULES="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Resources/node_modules"
          if [ ! -d "$NODE_MODULES" ]; then
            exit 0
          fi

          COUNT_FILE="$(mktemp)"
          echo 0 > "$COUNT_FILE"

          find "$NODE_MODULES" -type f -perm -u+x 2>/dev/null | while IFS= read -r bin; do
            if file "$bin" 2>/dev/null | head -1 | grep -q "Mach-O"; then
              if codesign --force --options runtime --sign "$IDENTITY" "$bin" >/dev/null 2>&1; then
                count=$(cat "$COUNT_FILE")
                echo $((count + 1)) > "$COUNT_FILE"
              else
                echo "warning: failed to sign $bin"
              fi
            fi
          done

          signed_count=$(cat "$COUNT_FILE")
          rm -f "$COUNT_FILE"
          echo "Re-signed $signed_count Mach-O binaries inside node_modules"
        basedOnDependencyAnalysis: false

  AgentServerEventKit:
    type: tool
    platform: macOS
    sources:
      - AgentServerEventKit
    settings:
      base:
        PRODUCT_NAME: agent-server-eventkit
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.agent-server-eventkit
        INFOPLIST_FILE: AgentServerEventKit/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: true
