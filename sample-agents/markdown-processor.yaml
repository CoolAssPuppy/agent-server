id: markdown-processor
name: Markdown File Processor
description: >
  Watches a directory for markdown file changes and processes them.
  Demonstrates file-based agent orchestration where one agent's
  output triggers another agent's input.

schedule: "0 0 31 2 *"

prompt: |
  A markdown file has changed. Read it and process the content:

  1. Check for TODO items (lines starting with "- [ ]")
  2. Check for broken markdown links
  3. Validate any code blocks have a language specifier
  4. Check for common writing issues:
     - Sentences over 30 words
     - Passive voice usage
     - Missing alt text on images

  Create a review file alongside the original with a .review.md
  suffix containing your findings. If no issues found, write
  "No issues found" to the review file.

tools:
  - Read
  - Write
  - Glob
  - Grep

max_turns: 10
enabled: true
working_directory: "~/Documents/notes"

watch:
  - path: "~/Documents/notes"
    glob: "*.md"
